<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Card</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffdde1;
            font-family: 'Arial', sans-serif;
        }

        .book {
            position: relative;
            border-radius: 20px;
            width: 300px;
            height: 400px;
            background-color: #fff;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
            perspective: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #d63384;
        }

        .cover,
        .inner {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            transition: transform 0.5s;
        }

        .cover {
            background-color: #ff4f81;
            color: white;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
        }

        .inner {
            background-color: #fff3cd;
            color: #d63384;
            transform-origin: right;
        }

        .book:hover .cover {
            transform: rotateY(-120deg);
        }

        .book:hover .inner {
            transform: rotateY(-10deg);
        }
    </style>
</head>

<body>
    <div class="book">
        <p class="text">Happy</p>
        <div class="inner">
            <p class="text">Happy Valentine's Day! 💖</p>
        </div>
        <div class="cover">
            <p class="text">Open Me ❤️</p>
        </div>
    </div>
</body>

</html>
